<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证码生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        .title {
            font-size: 22px;
            color: #333;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 13px;
            color: #999;
            margin-bottom: 30px;
        }
        .code-display {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 2px dashed #667eea;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .code-display.warning {
            border-color: #f44336;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe0e0 100%);
        }
        .code {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            text-align: center;
            user-select: all;
        }
        .copy-btn {
            background: #667eea;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 24px;
            transition: all 0.2s;
        }
        .copy-btn:hover { background: #5568d3; }
        .copy-btn:active { transform: scale(0.95); }
        .timer-section { margin-top: 20px; }
        .timer-label {
            font-size: 13px;
            color: #999;
            margin-bottom: 6px;
        }
        .timer-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 1s linear;
        }
        .timer-fill.urgent {
            background: linear-gradient(90deg, #ff6b6b, #ee5a24);
        }
        .countdown {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            margin-top: 8px;
        }
        .countdown.urgent { color: #f44336; }
        .warning-text {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            color: #f44336;
            font-size: 13px;
            line-height: 1.5;
            font-weight: 700;
        }
        .warning-text.show { display: block; }
        .next-code-section {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #e8f5e9;
            border: 1px solid #4CAF50;
            border-radius: 8px;
        }
        .next-code-section.show { display: block; }
        .next-code-label {
            font-size: 12px;
            color: #4CAF50;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .next-code {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            user-select: all;
        }
        .info {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #f44336;
            line-height: 1.6;
        }
        .refreshing { opacity: 0.5; transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">验证码每5分钟自动刷新</div>
        
        <div class="code-display" id="codeDisplay">
            <div class="code" id="code">------</div>
            <button class="copy-btn" onclick="copyCode()">复制验证码</button>
        </div>

        <div class="timer-section">
            <div class="timer-bar">
                <div class="timer-fill" id="timerFill" style="width:100%"></div>
            </div>
            <div class="countdown" id="countdown">05:00</div>
        </div>

        <div class="warning-text" id="warningText">
            上方的验证码即将过期作废！<br>请复制下方的新验证码使用！
        </div>

        <div class="next-code-section" id="nextCodeSection">
            <div class="next-code-label">新验证码（即将生效）</div>
            <div class="next-code" id="nextCode">------</div>
            <button class="copy-btn" style="background:#4CAF50;margin-top:8px;" onclick="copyNextCode()">复制新验证码</button>
        </div>

        <div class="info">
            验证码为15位英文+数字组合<br>
            5分钟内有效，请尽快完成验证<br>
            登录有效期为一年，超过后需要重新验证
        </div>
    </div>

    <script>
    // === MD5 Implementation (Joseph Myers, widely tested) ===
    var md5 = (function() {
        function safeAdd(x, y) {
            var lsw = (x & 0xFFFF) + (y & 0xFFFF);
            var msw = (x >> 16) + (y >> 16) + (lsw >> 16);
            return (msw << 16) | (lsw & 0xFFFF);
        }
        function bitRotateLeft(num, cnt) { return (num << cnt) | (num >>> (32 - cnt)); }
        function md5cmn(q, a, b, x, s, t) { return safeAdd(bitRotateLeft(safeAdd(safeAdd(a, q), safeAdd(x, t)), s), b); }
        function md5ff(a, b, c, d, x, s, t) { return md5cmn((b & c) | (~b & d), a, b, x, s, t); }
        function md5gg(a, b, c, d, x, s, t) { return md5cmn((b & d) | (c & ~d), a, b, x, s, t); }
        function md5hh(a, b, c, d, x, s, t) { return md5cmn(b ^ c ^ d, a, b, x, s, t); }
        function md5ii(a, b, c, d, x, s, t) { return md5cmn(c ^ (b | ~d), a, b, x, s, t); }
        function binlMD5(x, len) {
            x[len >> 5] |= 0x80 << (len % 32);
            x[(((len + 64) >>> 9) << 4) + 14] = len;
            var i, olda, oldb, oldc, oldd;
            var a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;
            for (i = 0; i < x.length; i += 16) {
                olda = a; oldb = b; oldc = c; oldd = d;
                a=md5ff(a,b,c,d,x[i],7,-680876936); d=md5ff(d,a,b,c,x[i+1],12,-389564586); c=md5ff(c,d,a,b,x[i+2],17,606105819); b=md5ff(b,c,d,a,x[i+3],22,-1044525330);
                a=md5ff(a,b,c,d,x[i+4],7,-176418897); d=md5ff(d,a,b,c,x[i+5],12,1200080426); c=md5ff(c,d,a,b,x[i+6],17,-1473231341); b=md5ff(b,c,d,a,x[i+7],22,-45705983);
                a=md5ff(a,b,c,d,x[i+8],7,1770035416); d=md5ff(d,a,b,c,x[i+9],12,-1958414417); c=md5ff(c,d,a,b,x[i+10],17,-42063); b=md5ff(b,c,d,a,x[i+11],22,-1990404162);
                a=md5ff(a,b,c,d,x[i+12],7,1804603682); d=md5ff(d,a,b,c,x[i+13],12,-40341101); c=md5ff(c,d,a,b,x[i+14],17,-1502002290); b=md5ff(b,c,d,a,x[i+15],22,1236535329);
                a=md5gg(a,b,c,d,x[i+1],5,-165796510); d=md5gg(d,a,b,c,x[i+6],9,-1069501632); c=md5gg(c,d,a,b,x[i+11],14,643717713); b=md5gg(b,c,d,a,x[i],20,-373897302);
                a=md5gg(a,b,c,d,x[i+5],5,-701558691); d=md5gg(d,a,b,c,x[i+10],9,38016083); c=md5gg(c,d,a,b,x[i+15],14,-660478335); b=md5gg(b,c,d,a,x[i+4],20,-405537848);
                a=md5gg(a,b,c,d,x[i+9],5,568446438); d=md5gg(d,a,b,c,x[i+14],9,-1019803690); c=md5gg(c,d,a,b,x[i+3],14,-187363961); b=md5gg(b,c,d,a,x[i+8],20,1163531501);
                a=md5gg(a,b,c,d,x[i+13],5,-1444681467); d=md5gg(d,a,b,c,x[i+2],9,-51403784); c=md5gg(c,d,a,b,x[i+7],14,1735328473); b=md5gg(b,c,d,a,x[i+12],20,-1926607734);
                a=md5hh(a,b,c,d,x[i+5],4,-378558); d=md5hh(d,a,b,c,x[i+8],11,-2022574463); c=md5hh(c,d,a,b,x[i+11],16,1839030562); b=md5hh(b,c,d,a,x[i+14],23,-35309556);
                a=md5hh(a,b,c,d,x[i+1],4,-1530992060); d=md5hh(d,a,b,c,x[i+4],11,1272893353); c=md5hh(c,d,a,b,x[i+7],16,-155497632); b=md5hh(b,c,d,a,x[i+10],23,-1094730640);
                a=md5hh(a,b,c,d,x[i+13],4,681279174); d=md5hh(d,a,b,c,x[i],11,-358537222); c=md5hh(c,d,a,b,x[i+3],16,-722521979); b=md5hh(b,c,d,a,x[i+6],23,76029189);
                a=md5hh(a,b,c,d,x[i+9],4,-640364487); d=md5hh(d,a,b,c,x[i+12],11,-421815835); c=md5hh(c,d,a,b,x[i+15],16,530742520); b=md5hh(b,c,d,a,x[i+2],23,-995338651);
                a=md5ii(a,b,c,d,x[i],6,-198630844); d=md5ii(d,a,b,c,x[i+7],10,1126891415); c=md5ii(c,d,a,b,x[i+14],15,-1416354905); b=md5ii(b,c,d,a,x[i+5],21,-57434055);
                a=md5ii(a,b,c,d,x[i+12],6,1700485571); d=md5ii(d,a,b,c,x[i+3],10,-1894986606); c=md5ii(c,d,a,b,x[i+10],15,-1051523); b=md5ii(b,c,d,a,x[i+1],21,-2054922799);
                a=md5ii(a,b,c,d,x[i+8],6,1873313359); d=md5ii(d,a,b,c,x[i+15],10,-30611744); c=md5ii(c,d,a,b,x[i+6],15,-1560198380); b=md5ii(b,c,d,a,x[i+13],21,1309151649);
                a=md5ii(a,b,c,d,x[i+4],6,-145523070); d=md5ii(d,a,b,c,x[i+11],10,-1120210379); c=md5ii(c,d,a,b,x[i+2],15,718787259); b=md5ii(b,c,d,a,x[i+9],21,-343485551);
                a=safeAdd(a,olda); b=safeAdd(b,oldb); c=safeAdd(c,oldc); d=safeAdd(d,oldd);
            }
            return [a, b, c, d];
        }
        function binl2rstr(input) {
            var output = ''; var length32 = input.length * 32;
            for (var i = 0; i < length32; i += 8) { output += String.fromCharCode((input[i >> 5] >>> (i % 32)) & 0xFF); }
            return output;
        }
        function rstr2binl(input) {
            var output = []; output[(input.length * 8) >> 5] = 0;
            for (var i = 0; i < input.length * 8; i += 8) { output[i >> 5] |= (input.charCodeAt(i / 8) & 0xFF) << (i % 32); }
            return output;
        }
        function rstr2hex(input) {
            var hexTab = '0123456789abcdef'; var output = '';
            for (var i = 0; i < input.length; i++) { var x = input.charCodeAt(i); output += hexTab.charAt((x >>> 4) & 0xF) + hexTab.charAt(x & 0xF); }
            return output;
        }
        return function(str) { return rstr2hex(binl2rstr(binlMD5(rstr2binl(str), str.length * 8))); };
    })();

    var SECRET = "QingyuAuth2024Key";
    var SLOT_MS = 5 * 60 * 1000;
    var WARNING_THRESHOLD = 60 * 1000;
    var CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    function generatePassword(timestamp) {
        var slot = Math.floor(timestamp / SLOT_MS);
        var input = SECRET + slot;
        var hash = md5(input);
        var bytes = [];
        for (var i = 0; i < hash.length; i += 2) { bytes.push(parseInt(hash.substr(i, 2), 16)); }
        var code = "";
        for (var i = 0; i < 15; i++) { code += CHARS.charAt(bytes[i] % 36); }
        return code;
    }

    function updateCode() {
        document.getElementById('code').textContent = generatePassword(Date.now());
    }

    function updateTimer() {
        var now = Date.now();
        var slotStart = Math.floor(now / SLOT_MS) * SLOT_MS;
        var elapsed = now - slotStart;
        var remaining = SLOT_MS - elapsed;
        var percent = (remaining / SLOT_MS) * 100;
        var minutes = Math.floor(remaining / 60000);
        var seconds = Math.floor((remaining % 60000) / 1000);
        var timerFill = document.getElementById('timerFill');
        var countdown = document.getElementById('countdown');
        var codeDisplay = document.getElementById('codeDisplay');
        var warningText = document.getElementById('warningText');
        var nextCodeSection = document.getElementById('nextCodeSection');

        timerFill.style.width = percent + '%';
        countdown.textContent = String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');

        if (remaining <= WARNING_THRESHOLD) {
            timerFill.classList.add('urgent');
            countdown.classList.add('urgent');
            codeDisplay.classList.add('warning');
            warningText.classList.add('show');
            nextCodeSection.classList.add('show');
            document.getElementById('nextCode').textContent = generatePassword(now + SLOT_MS);
        } else {
            timerFill.classList.remove('urgent');
            countdown.classList.remove('urgent');
            codeDisplay.classList.remove('warning');
            warningText.classList.remove('show');
            nextCodeSection.classList.remove('show');
        }

        var currentSlot = Math.floor(now / SLOT_MS);
        if (window.lastSlot !== currentSlot) {
            window.lastSlot = currentSlot;
            var display = document.getElementById('codeDisplay');
            display.classList.add('refreshing');
            setTimeout(function() { updateCode(); display.classList.remove('refreshing'); }, 300);
        }
    }

    function doCopy(code) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(code).then(function() { showCopySuccess(); }).catch(function() { fallbackCopy(code); });
        } else { fallbackCopy(code); }
    }

    function copyCode() { doCopy(document.getElementById('code').textContent); }
    function copyNextCode() {
        doCopy(document.getElementById('nextCode').textContent);
        var btn = event.target;
        btn.textContent = '已复制';
        btn.style.background = '#2196F3';
        setTimeout(function() { btn.textContent = '复制新验证码'; btn.style.background = '#4CAF50'; }, 2000);
    }

    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0'; ta.style.opacity = '0';
        ta.setAttribute('readonly', '');
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        if (ok) { showCopySuccess(); } else {
            var codeEl = document.getElementById('code');
            var range = document.createRange();
            range.selectNodeContents(codeEl);
            var sel = window.getSelection();
            sel.removeAllRanges(); sel.addRange(range);
            var btn = document.querySelector('.copy-btn');
            btn.textContent = '请长按复制'; btn.style.background = '#FF9800';
            setTimeout(function() { btn.textContent = '复制验证码'; btn.style.background = ''; }, 3000);
        }
    }

    function showCopySuccess() {
        var btn = document.querySelector('.copy-btn');
        var original = btn.textContent;
        btn.textContent = '已复制'; btn.style.background = '#4CAF50';
        setTimeout(function() { btn.textContent = original; btn.style.background = ''; }, 2000);
    }

    window.lastSlot = Math.floor(Date.now() / SLOT_MS);
    updateCode();
    updateTimer();
    setInterval(updateTimer, 1000);
    </script>
</body>
</html>
